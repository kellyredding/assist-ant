name: AssistAntApp
options:
  bundleIdPrefix: com.kellyredding
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.2"

packages:
  Galactic:
    url: https://github.com/kellyredding/Galactic.git
    exactVersion: 0.6.0
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.5.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    exactVersion: 1.10.0

targets:
  AssistAntApp:
    type: application
    platform: macOS
    sources:
      - AssistAntApp
    dependencies:
      - package: Galactic
        product: Galactic
      - package: GRDB
        product: GRDB
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    info:
      path: AssistAntApp/Info.plist
      properties:
        CFBundleName: "Assist Ant"
        CFBundleDisplayName: "Assist Ant"
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        CFBundleIconName: AppIcon
        # NB: NOT LSUIElement=true. This is a regular dock app:
        # AppDelegate sets .regular at launch and never changes
        # it. Closing the main window leaves the app running —
        # the dock icon and File > Main Window reopen it.
    settings:
      base:
        # The bundle wrapper is "Assist Ant.app" (the user-facing name the
        # Dock, ⌘-Tab switcher, and Spotlight key off the .app filename),
        # but the Mach-O executable stays "AssistAnt" — no space — so
        # process matching and scripts don't have to quote it. The bundle
        # identifier is unchanged, so settings and permissions persist.
        PRODUCT_NAME: "Assist Ant"
        EXECUTABLE_NAME: AssistAnt
        PRODUCT_BUNDLE_IDENTIFIER: com.kellyredding.AssistAnt
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # The keystroke model and its assertions now live in Galactic, which tests
  # the Swift matcher and its JavaScript twin against one fixture in one
  # process. A standalone tool here could only re-check half of that against a
  # second copy of the fixture.

  ItemsSmoke:
    type: tool
    platform: macOS
    sources:
      - AssistAntApp/Models/Items
      - AssistAntApp/Models/Paths.swift
      - AssistAntApp/Models/SessionReconciler.swift
      - AssistAntApp/Models/AnnouncementSound.swift
      - AssistAntApp/Models/CalendarAnnouncementSettings.swift
      - AssistAntApp/Models/CalendarAnnouncementDecisions.swift
      - AssistAntApp/Models/TemporaryMuteRule.swift
      - AssistAntApp/Models/Keystrokes
      - AssistAntApp/Models/MainTab.swift
      - AssistAntApp/Models/CaptureKind.swift
      - ItemsSmoke
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        SWIFT_VERSION: "5.10"
